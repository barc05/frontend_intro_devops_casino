server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://10.0.138.125:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        location /api/bonos/ {
        proxy_pass http://bonos-service:8004/;
        }

        location /api/apuestas/ {
        proxy_pass http://apuestas-service:8005/;
        }

        location /api/estadisticas/ {
        proxy_pass http://estadisticas-service:8006/;
        }

        location /api/ {
        proxy_pass http://casino-backend:3000/;
        }
    }
}